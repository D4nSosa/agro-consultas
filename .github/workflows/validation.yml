name: Agro Consultas validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser module syntax
        run: python tests/check_frontend_syntax.py
      - name: Validate unified workspace integration
        run: python tests/workspace_integration.test.py -v
      - name: Validate shared lot geometry and territorial analysis
        run: node --experimental-default-type=module --test tests/lotContext.test.mjs tests/userPreferences.test.mjs tests/fireMonitoring.test.mjs tests/firePageContent.test.mjs tests/forestGeo.test.mjs tests/territorial-recommendations.test.mjs tests/coreAnalysis.test.mjs tests/climateService.test.mjs tests/crop-visibility-and-mobile-nav.test.mjs tests/forestry-candidates-ui.test.mjs tests/satelliteService.test.mjs tests/reportPageContent.test.mjs tests/dataModel.test.mjs

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate local datasets
        run: python self_created_tools/validate_datasets.py
      - name: Run backend tests
        run: python -m pytest tests/ -q
