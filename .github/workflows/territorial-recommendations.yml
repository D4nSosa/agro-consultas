name: Territorial recommendations regression
on:
  pull_request:
    paths:
      - 'utils/scoring.js'
      - 'services/climateService.js'
      - 'services/recommendationEngine.js'
      - 'script.js'
      - 'data/cultivos.json'
      - 'data/provincias.json'
      - 'tests/territorial-recommendations.test.mjs'
      - '.github/workflows/territorial-recommendations.yml'
  push:
    branches:
      - main
    paths:
      - 'utils/scoring.js'
      - 'services/climateService.js'
      - 'services/recommendationEngine.js'
      - 'script.js'
      - 'data/cultivos.json'
      - 'data/provincias.json'
      - 'tests/territorial-recommendations.test.mjs'
      - '.github/workflows/territorial-recommendations.yml'
jobs:
  territorial-recommendations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run territorial recommendation regressions
        run: node --experimental-default-type=module --test tests/territorial-recommendations.test.mjs
